<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나갈시간</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <header class="app-header">
      <h1>나갈시간</h1>
      <p>도착 시간만 입력하면 탈 열차와 출발·기상 시간을 알려 드려요.</p>
    </header>

    <section>
      <h2>요일별 계획</h2>
      <div id="day-tabs" role="tablist"></div>
      <div id="selected-plan"></div>
      <div id="alarm-list"></div>
      <button id="download-ics" type="button">캘린더로 보내기</button>
    </section>

    <details id="week-registration">
      <summary>요일별 도착 시간</summary>
      <section>
        <p id="week-empty-message" hidden>먼저 경로를 등록해 주세요</p>
        <div id="week-inputs"></div>
      </section>
    </details>

    <details id="route-registration" open>
      <summary>경로 등록</summary>
      <form id="route-form">
        <label>
          이름
          <input id="route-name" name="name" type="text" placeholder="예: 학교">
          <span class="field-error" id="name-error"></span>
        </label>

        <label>
          등록 방식
          <select id="route-type" name="type">
            <option value="trip">열차 추천</option>
            <option value="custom">직접 입력</option>
          </select>
        </label>

        <div id="custom-fields" hidden>
          <label>
          열차 시각
          <textarea id="custom-times-input" name="customTimes" placeholder="07:47, 07:57"></textarea>
          <span class="field-error" id="custom-times-error"></span>
          </label>
          <label>
            집에서 역까지(분)
            <input id="walk-min" name="walkMin" type="number" min="0">
            <span class="field-error" id="walk-error"></span>
          </label>
          <label>
            탑승 후 이동 시간(분)
            <input id="ride-min" name="rideMin" type="number" min="0">
            <small>환승과 마지막 도보까지 포함한 전체 시간</small>
            <span class="field-error" id="ride-error"></span>
          </label>
          <label>
            준비 시간(분)
            <input id="prep-min" name="prepMin" type="number" min="0" value="60">
            <span class="field-error" id="prep-error"></span>
          </label>
          <label>
            최소 여유(분)
            <input id="slack-min" name="slackMin" type="number" min="0" value="10">
            <span class="field-error" id="slack-error"></span>
          </label>
        </div>

        <div id="trip-fields" hidden>
          <label>
            출발역
            <input id="trip-from" name="fromStation" list="trip-stations" autocomplete="off">
            <span class="field-error" id="trip-from-error"></span>
          </label>
          <label>
            도착역
            <input id="trip-to" name="toStation" list="trip-stations" autocomplete="off">
            <span class="field-error" id="trip-to-error"></span>
          </label>
          <datalist id="trip-stations"></datalist>
          <label>
            집에서 출발역까지(분)
            <input id="trip-walk-min" name="tripWalkMin" type="number" min="0">
            <span class="field-error" id="trip-walk-error"></span>
          </label>
          <label>
            도착역에서 목적지까지(분)
            <input id="trip-last-walk-min" name="lastWalkMin" type="number" min="0">
            <span class="field-error" id="trip-last-walk-error"></span>
          </label>
          <label>
            일어나서 나가기까지(분)
            <input id="trip-prep-min" name="tripPrepMin" type="number" min="0" value="60">
            <span class="field-error" id="trip-prep-error"></span>
          </label>
          <details>
            <summary>더 보기</summary>
            <label>
              최소 여유(분)
              <input id="trip-slack-min" name="tripSlackMin" type="number" min="0" value="5">
              <span class="field-error" id="trip-slack-error"></span>
            </label>
            <label>
              환승 시간(분)
              <input id="trip-transfer-min" name="transferMin" type="number" min="0" value="4">
              <span class="field-error" id="trip-transfer-error"></span>
            </label>
          </details>
        </div>

        <button type="submit">저장</button>
      </form>
      <div id="routes-list"></div>
    </details>
  </main>

  <script src="data/trips.js"></script>
  <script src="js/time.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
